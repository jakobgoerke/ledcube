# Settings for the LED cube setup. Sourced by scripts/deploy.sh and
# device/setup.sh (the file is copied to the cube along with the repo).

# SSH target of the cube
LEDCUBE_SSH=pi@ledcube

# Where everything gets built and installed on the cube
LEDCUBE_PREFIX=/opt/ledcube

# LED matrix library, pinned so a re-run produces the same result.
# Bump it deliberately and re-run scripts/deploy.sh.
RGBMATRIX_REPO=https://github.com/hzeller/rpi-rgb-led-matrix.git
RGBMATRIX_COMMIT=3da7a3bdfca4637bb79ff038bc2bb26965197db5

# Compile-time settings of cpu-stats-gl
CUBE_CORES=16       # number of CPU threads the sender reports (segments on the ring)
CUBE_PORT=1234      # UDP port the cube listens on
CUBE_BLANK=12       # blank the panels after this much silence (0 = never)

# Runtime flags for rpi-rgb-led-matrix, appended to the compiled-in defaults
# (adafruit-hat-pwm, FM6126A, 64 rows x 192 cols, pwm-bits 11, lsb 50ns).
# Written to /etc/default/ledcube, so they can also be tweaked on the cube
# followed by `sudo systemctl restart ledcube`. Examples:
#   --led-gpio-mapping=adafruit-hat   (Bonnet without the GPIO4-GPIO18 jumper)
#   --led-rp1-pio=1                   (Pi 5 PIO backend, lower CPU usage)
#   --led-slowdown-gpio=2             (if the panels flicker or show garbage)
#   --led-brightness=60
# The Remap mapper turns each panel to match how it is mounted in the case
# (entries in cable order from the Bonnet; n/e/s/w = rotation, see README).
# Brightness is reduced because the shared 5V supply cannot keep up.
LED_FLAGS="--led-cols=64 --led-chain=3 --led-pixel-mapper=Remap:192,64|128,0e|64,0s|0,0s --led-brightness=50"

# Pin the panel refresh thread to its own core (adds isolcpus=3 to cmdline.txt)
ISOLATE_CPU=yes
